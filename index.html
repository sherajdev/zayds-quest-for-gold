'use strict';const c=document.querySelector('#c'),g=c.getContext('2d'),W=c.width,H=c.height,S=2400;const $=s=>document.querySelector(s),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),cl=(v,a,b)=>Math.max(a,Math.min(b,v));let keys={},p=[],active=0,region=0,step=0,foes=[],props=[],coins=[],particles=[],projectiles=[],gold=0,stolen=0,maps=0,t=0,seed=1,playing=false,paused=false,ending=false,boss=null,dialog='',until=0,shake=0,checkpoint=null;const regions=[{name:'Whispering Forest',ground:'#43583c',ground2:'#566b48',tree:'#294733',sky:'#b7c995',target:{x:1740,y:690},gate:{x:2170,y:1230},enemy:'Goblin',line:'Look at those old ruins, Zayd! I bet there’s gold inside.'},{name:'Lost Gold Mines',ground:'#534b42',ground2:'#65584a',tree:'#826c50',sky:'#d6b488',target:{x:1510,y:1640},gate:{x:2150,y:2100},enemy:'Stone guardian',line:'These tunnels are full of gold! We have to find the next map.'},{name:'Dragon Mountains',ground:'#65747a',ground2:'#849397',tree:'#405957',sky:'#c7e0e8',target:{x:1700,y:490},gate:{x:2140,y:300},enemy:'Ice dragon',line:'One more map, Zayd. Think of how rich we’ll be!'},{name:'Golden Kingdom',ground:'#655642',ground2:'#827154',tree:'#554638',sky:'#e3b66f',target:{x:1800,y:1320},gate:{x:2100,y:1320},enemy:'Royal guardian',line:'The crown is finally within reach. All that beautiful gold…'}];const startPos={x:300,y:1150};function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function say(s,n=280){dialog=s;until=t+n}function hero(name,color){return {name,color,x:300,y:1150,hp:100,face:0,cd:0,q:0,f:0,z:0,guard:0,slash:0}}function begin(){$('#start').onclick=begin;keys={};p=[hero('Zayd','#426b9e'),hero('Aahil','#b08a44')];active=0;region=0;gold=0;maps=0;t=0;ending=false;load(0);playing=true;$('#overlay').classList.add('hidden');c.focus()}function load(i){region=i;step=0;boss=null;paused=false;seed=99+i*456;foes=[];props=[];coins=[];particles=[];projectiles=[];p.forEach((h,j)=>{h.x=300-j*45;h.y=1150+j*35;h.hp=100;h.cd=h.q=h.f=h.z=h.guard=0});let r=
